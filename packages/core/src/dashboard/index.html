            }) : <div style={{color:'var(--text-muted)', padding:20}}>No data yet</div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>

        <div className="metric-card">
          <h3>Acceptance Rate by Rule</h3>
          {acceptance && acceptance.results ? (
            acceptance.results.length > 0 ? acceptance.results.slice(0, 10).map((r, i) => (
              <div key={i} className="metric-bar-row">
                <span className="metric-bar-label" title={r.rule_id}>{(r.rule_id || 'unknown').slice(0, 20)}</span>
                <div className="metric-bar-track">
                  <div className="metric-bar-fill" style={{width: `${r.rate * 100}%`, background: r.rate > 0.7 ? 'var(--success)' : r.rate > 0.4 ? 'var(--medium)' : 'var(--critical)'}} />
                </div>
                <span className="metric-bar-value">{(r.rate * 100).toFixed(0)}%</span>
              </div>
            )) : <div style={{color:'var(--text-muted)', padding:20}}>No data yet</div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>

        <div className="metric-card">
          <h3>Fix Velocity (per week)</h3>
          {velocity && velocity.results ? (
            velocity.results.length > 0 ? (
              <table className="metric-table">
                <tbody>
                  {velocity.results.slice(0, 12).map((r, i) => (
                    <tr key={i}>
                      <td style={{color:'var(--text-muted)', fontFamily:'var(--font-mono)', fontSize:12}}>{r.period}</td>
                      <td style={{fontWeight:600}}>{r.fixed_count}</td>
                      <td>
                        {r.trend === 'up' ? <span style={{color:'var(--success)'}}>&#9650;</span> :
                         r.trend === 'down' ? <span style={{color:'var(--critical)'}}>&#9660;</span> :
                         <span style={{color:'var(--text-muted)'}}>&#9644;</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : <div style={{color:'var(--text-muted)', padding:20}}>No data yet</div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>

        <div className="metric-card">
          <h3>Top Rejection Patterns</h3>
          {rejections && rejections.results ? (
            rejections.results.length > 0 ? (
              <table className="metric-table">
                <tbody>
                  {rejections.results.slice(0, 10).map((r, i) => (
                    <tr key={i}>
                      <td><Badge type="source" value={r.source} /></td>
                      <td>{r.pattern_tag}</td>
                      <td style={{fontWeight:600, fontFamily:'var(--font-mono)'}}>{r.occurrences}</td>
                      <td style={{color:'var(--text-muted)', fontFamily:'var(--font-mono)', fontSize:11}}>{r.rule_id || ''}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : <div style={{color:'var(--text-muted)', padding:20}}>No rejections yet</div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>

        <div className="metric-card">
          <h3>Issues Found vs Fixed</h3>
          {velocity && velocity.results ? (
            velocity.results.length > 0 ? (
              <table className="metric-table">
                <tbody>
                  <tr style={{fontWeight:600, fontSize:11, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.5px'}}>
                    <td>Period</td><td>Found</td><td>Fixed</td>
                  </tr>
                  {velocity.results.slice(0, 8).map((r, i) => (
                    <tr key={i}>
                      <td style={{color:'var(--text-muted)', fontFamily:'var(--font-mono)', fontSize:12}}>{r.period}</td>
                      <td>{r.found_count || 0}</td>
                      <td style={{color:'var(--success)', fontWeight:600}}>{r.fixed_count || 0}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : <div style={{color:'var(--text-muted)', padding:20}}>No data yet</div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>
      </div>
    </div>
  );
}

// ─── Settings Page ─────────────────────────────────────────
function SettingsPage({ addToast }) {
  const [scanners, setScanners] = useState([]);
  const [testResults, setTestResults] = useState({});
  const [testing, setTesting] = useState({});
  // Scanner credential state
  const [scannerFields, setScannerFields] = useState({});
  const [scannerCreds, setScannerCreds] = useState({});
  const [credSaving, setCredSaving] = useState({});
  // Apiiro install/login state
  const [apiiroInstalling, setApiiroInstalling] = useState(false);
  const [apiiroLoggingIn, setApiiroLoggingIn] = useState(false);
  const [apiiroInstallLog, setApiiroInstallLog] = useState('');
  const [apiiroLoginLog, setApiiroLoginLog] = useState('');

  useEffect(() => {
    api('/scanners').then(d => setScanners(d.scanners || [])).catch(() => {});
  }, []);

  // Load setup fields for each scanner
  useEffect(() => {
    if (scanners.length === 0) return;
    scanners.forEach(s => {
      api(`/scanners/${s.name}/setup-fields`).then(d => {
        setScannerFields(prev => ({...prev, [s.name]: d.fields || []}));
        setScannerCreds(prev => ({...prev, [s.name]: d.saved || {}}));
      }).catch(() => {});
    });
  }, [scanners]);

  const testConnection = async (source) => {
    setTesting(t => ({...t, [source]: true}));
    try {
      const result = await api(`/scanners/${source}/test`, { method: 'POST' });
      setTestResults(r => ({...r, [source]: result}));
      addToast(`${source}: test complete`, 'success');
    } catch (e) {
      setTestResults(r => ({...r, [source]: { error: e.message }}));
      addToast(`${source}: ${e.message}`, 'error');
    }
    setTesting(t => ({...t, [source]: false}));
  };

  // Save scanner credentials
  const saveCreds = async (source) => {
    setCredSaving(prev => ({...prev, [source]: true}));
    try {
      await api(`/scanners/${source}/config`, {
        method: 'POST',
        body: scannerCreds[source] || {},
      });
      addToast(`${source} credentials saved`, 'success');
    } catch (e) {
      addToast(`Save failed: ${e.message}`, 'error');
    }
    setCredSaving(prev => ({...prev, [source]: false}));
  };

  const updateCred = (source, key, value) => {
    setScannerCreds(prev => ({
      ...prev,
      [source]: {...(prev[source] || {}), [key]: value}
    }));
  };

  // Apiiro install
  const installApiiro = async () => {
    setApiiroInstalling(true);
    setApiiroInstallLog('Starting install...');
    try {
      await api('/scanners/apiiro/install', { method: 'POST' });
      // Poll for completion
      const poll = setInterval(async () => {
        try {
          const status = await api('/scanners/apiiro/process/install');
          if (status.status === 'success') {
            clearInterval(poll);
            setApiiroInstalling(false);
            setApiiroInstallLog(status.stdout || 'Installed successfully');
            addToast('Apiiro CLI installed', 'success');
            testConnection('apiiro');
          } else if (status.status === 'failed') {
            clearInterval(poll);
            setApiiroInstalling(false);
            setApiiroInstallLog(status.stderr || 'Install failed');
            addToast('Apiiro CLI install failed', 'error');
          } else {
            setApiiroInstallLog('Installing...');
          }
        } catch (_) {}
      }, 2000);
    } catch (e) {
      setApiiroInstalling(false);
      setApiiroInstallLog(e.message);
      addToast(`Install failed: ${e.message}`, 'error');
    }
  };

  // Apiiro login
  const loginApiiro = async () => {
    setApiiroLoggingIn(true);
    setApiiroLoginLog('Opening browser for login...');
    try {
      const r = await api('/scanners/apiiro/login', { method: 'POST' });
      setApiiroLoginLog(r.message || 'Waiting for browser auth...');
      // Poll for completion
      const poll = setInterval(async () => {
        try {
          const status = await api('/scanners/apiiro/process/login');
          if (status.status === 'success') {
            clearInterval(poll);
            setApiiroLoggingIn(false);
            setApiiroLoginLog('Login successful');
            addToast('Apiiro login successful', 'success');
            testConnection('apiiro');
          } else if (status.status === 'failed') {
            clearInterval(poll);
            setApiiroLoggingIn(false);
            setApiiroLoginLog(status.stderr || 'Login failed');
            addToast('Apiiro login failed', 'error');
          }
        } catch (_) {}
      }, 3000);
    } catch (e) {
      setApiiroLoggingIn(false);
      setApiiroLoginLog(e.message);
      addToast(`Login failed: ${e.message}`, 'error');
    }
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Settings</h1>
          <p className="page-subtitle">Scanner credentials and connections</p>
        </div>
      </div>

      {/* ── Scanner Setup ── */}
      <div className="settings-section">
        <div className="settings-section-title">{Icons.shield} Scanner Setup</div>
        <div className="settings-section-sub">Configure credentials and test connections for each scanner</div>

        {scanners.map(s => {
          const result = testResults[s.name];
          const fields = scannerFields[s.name] || [];
          const creds = scannerCreds[s.name] || {};
          const isInstalled = result?.installed?.installed;
          const isAuthed = result?.auth?.authenticated;
          const isApiiro = s.name === 'apiiro';

          return (
            <div key={s.name} className="scanner-setup-card">
              <div className="scanner-setup-header">
                <h3>
                  <span className={`s-dot ${result ? (result.error ? 'red' : ((isApiiro ? isInstalled !== false : true) ? 'green' : 'red')) : 'gray'}`} />
                  {s.displayName || s.name}
                  <span style={{fontSize:11, color:'var(--text-muted)', fontFamily:'var(--font-mono)', fontWeight:400}}>@autofix-hub/plugin-{s.name}</span>
                </h3>
                <div className="scanner-status-badges">
                  {isApiiro && result && !result.error && result.installed && (
                    <span className={`status-badge ${isInstalled ? 'ok' : 'err'}`}>
                      {isInstalled ? 'CLI OK' : 'CLI Missing'}
                    </span>
                  )}
                  {result && !result.error && result.auth && (
                    <span className={`status-badge ${isAuthed ? 'ok' : 'err'}`}>
                      {isAuthed ? 'Authenticated' : 'Not Authenticated'}
                    </span>
                  )}
                  {!result && <span className="status-badge pending">Not tested</span>}
                  {result?.error && <span className="status-badge err">Error</span>}
                </div>
              </div>

              {/* Apiiro-specific: install + login */}
              {isApiiro && (
                <div>
                  <div className="scanner-install-bar">
                    <span className="install-status">
                      {result?.installed?.installed
                        ? `Apiiro CLI: ${result.installed.message || 'installed'}`
                        : 'Apiiro CLI not installed'}
                    </span>
                    <button className="btn btn-sm" onClick={installApiiro} disabled={apiiroInstalling}>
                      {apiiroInstalling ? 'Installing...' : 'Install CLI'}
                    </button>
                    <button className="btn btn-sm btn-primary" onClick={loginApiiro} disabled={apiiroLoggingIn}>
                      {apiiroLoggingIn ? 'Logging in...' : 'Login'}
                    </button>
                  </div>
                  {(apiiroInstallLog || apiiroLoginLog) && (
                    <div className="log-output">{apiiroInstallLog || apiiroLoginLog}</div>
                  )}
                </div>
              )}

              {/* Credential form */}
              {fields.length > 0 && (
                <div>
                  <div className="scanner-cred-form">
                    {fields.map(f => (
                      <div key={f.name} className="env-field">
                        <label>{f.name}</label>
                        {f.message && <div className="env-desc">{f.message}</div>}
                        <input
                          type={/key|token|password|secret/i.test(f.name) ? 'password' : 'text'}
                          value={creds[f.name] || ''}
                          placeholder={f.default || ''}
                          onChange={e => updateCred(s.name, f.name, e.target.value)}
                        />
                      </div>
                    ))}
                  </div>
                  <div className="settings-actions">
                    <button className="btn btn-primary btn-sm" onClick={() => saveCreds(s.name)} disabled={credSaving[s.name]}>
                      {credSaving[s.name] ? 'Saving...' : 'Save Credentials'}
                    </button>
                    <button className="btn btn-sm" onClick={() => testConnection(s.name)} disabled={testing[s.name]}>
                      {testing[s.name] ? 'Testing...' : 'Test Connection'}
                    </button>
                  </div>
                </div>
              )}

              {fields.length === 0 && !isApiiro && (
                <div style={{display:'flex', gap:10, alignItems:'center'}}>
                  <span style={{fontSize:13, color:'var(--text-muted)'}}>No credentials required</span>
                  <button className="btn btn-sm" onClick={() => testConnection(s.name)} disabled={testing[s.name]}>
                    {testing[s.name] ? 'Testing...' : 'Test Connection'}
                  </button>
                </div>
              )}

              {/* Connection test details */}
              {result && !result.error && (
                <div style={{marginTop:12, fontSize:12, color:'var(--text-muted)'}}>
                  {isApiiro && result.installed && <div>CLI: {result.installed.message || (result.installed.installed ? 'OK' : 'Not found')}</div>}
                  {result.auth && <div>Auth: {result.auth.message || (result.auth.authenticated ? 'OK' : 'Not authenticated')}</div>}
                </div>
              )}
              {result?.error && <div style={{marginTop:12, fontSize:12, color:'var(--critical)'}}>Error: {result.error}</div>}
            </div>
          );
        })}
        {scanners.length === 0 && <div style={{color:'var(--text-muted)', padding:20}}>No plugins installed</div>}
      </div>
    </div>
  );
}

// ─── Overview Page ─────────────────────────────────────────
function OverviewPage({ stats, clusters, scanHistory, addToast, onRefresh }) {
  const severities = ['critical', 'high', 'medium', 'low', 'info'];
  const sevColors = { critical: 'var(--critical)', high: 'var(--high)', medium: 'var(--medium)', low: 'var(--low)', info: 'var(--info)' };
  const [fetching, setFetching] = useState({});
  const [scanners, setScanners] = useState([]);

  useEffect(() => {
    api('/scanners').then(d => setScanners(d.scanners || [])).catch(() => {});
  }, []);

  const fetchSource = async (source) => {
    setFetching(prev => ({...prev, [source]: true}));
    try {
      const result = await api(`/scanners/${source}/fetch`, {
        method: 'POST',
        body: {},
      });
      if (result.success) {
        addToast(`${source}: fetch complete`, 'success');
        if (onRefresh) onRefresh();
      } else {
        addToast(`${source}: ${result.error || 'fetch failed'}`, 'error');
      }
    } catch (e) {
      addToast(`${source}: ${e.message}`, 'error');
    }
    setFetching(prev => ({...prev, [source]: false}));
  };

  const fetchAll = async () => {
    for (const s of scanners) {
      await fetchSource(s.name);
    }
  };

  const sevCounts = useMemo(() => {
    if (!stats || !stats.by_severity) return {};
    return stats.by_severity;
  }, [stats]);

  const totalSev = useMemo(() => {
    return Object.values(sevCounts).reduce((a, b) => a + b, 0) || 1;
  }, [sevCounts]);

  const topClusters = (clusters || []).slice(0, 5);
  const anyFetching = Object.values(fetching).some(Boolean);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Overview</h1>
          <p className="page-subtitle">Dashboard summary for your project</p>
        </div>
        <div className="page-actions">
          <button className="btn btn-primary" onClick={fetchAll} disabled={anyFetching}>
            {Icons.zap} {anyFetching ? 'Fetching...' : 'Fetch All'}
          </button>
          {scanners.map(s => (
            <button key={s.name} className="btn btn-sm" onClick={() => fetchSource(s.name)} disabled={fetching[s.name]}>
              {fetching[s.name] ? `${s.name}...` : s.displayName || s.name}
            </button>
          ))}
        </div>
      </div>

      <div className="stat-grid">
        <div className="stat-card accent">
          <div className="stat-label">Total Issues</div>
          <div className="stat-value">{stats?.total || 0}</div>
          <div className="stat-sub">{stats?.by_source ? Object.entries(stats.by_source).map(([s,c]) => `${s}: ${c.total || c.open || 0}`).join(' / ') : 'across all scanners'}</div>
        </div>
        <div className="stat-card critical">
          <div className="stat-label">Open</div>
          <div className="stat-value" style={{color:'var(--low)'}}>{stats?.open || 0}</div>
          <div className="stat-sub">awaiting fix</div>
        </div>
        <div className="stat-card info">
          <div className="stat-label">AI Fixed</div>
          <div className="stat-value" style={{color:'var(--accent)'}}>{stats?.ai_fixed || 0}</div>
          <div className="stat-sub">awaiting review</div>
        </div>
        <div className="stat-card success">
          <div className="stat-label">Verified</div>
          <div className="stat-value" style={{color:'var(--success)'}}>{stats?.verified || 0}</div>
          <div className="stat-sub">ready to merge</div>
        </div>
        <div className="stat-card warning">
          <div className="stat-label">Acceptance Rate</div>
          <div className="stat-value">{stats?.total_ai_fixed > 0 ? Math.round((stats.verified + (stats.merged || 0)) / stats.total_ai_fixed * 100) : '\u2014'}%</div>
          <div className="stat-sub">{stats?.total_ai_fixed || 0} total attempts</div>
        </div>
      </div>

      <div className="overview-grid">
        <div className="overview-section">
          <h3>{Icons.activity} Issues by Severity</h3>
          <div className="severity-bar">
            {severities.map(sev => {
              const count = sevCounts[sev] || 0;
              const pct = (count / totalSev) * 100;
              if (pct < 1) return null;
              return <div key={sev} className="severity-bar-segment" style={{width:`${pct}%`, background: sevColors[sev]}}>{count > 0 ? count : ''}</div>;
            })}
          </div>
          <div className="severity-legend">
            {severities.map(sev => (
              <div key={sev} className="severity-legend-item">
                <div className="severity-legend-dot" style={{background: sevColors[sev]}} />
                {sev}: {sevCounts[sev] || 0}
              </div>
            ))}
          </div>
        </div>

        <div className="overview-section">
          <h3>{Icons.layers} Top Clusters</h3>
          {topClusters.length > 0 ? topClusters.map(c => (
            <div key={c.id} className="cluster-mini-card" onClick={() => navigate(`#/clusters/${c.id}`)}>
              <div>
                <div style={{fontWeight:600, fontSize:13}}>{c.cluster_key || c.id.slice(0,12)}</div>
                <div style={{fontSize:11, color:'var(--text-muted)', display:'flex', gap:8, marginTop:2}}>
                  <Badge type="source" value={c.source} />
                  <Badge type="status" value={c.status} />
                </div>
              </div>
              <div style={{fontWeight:700, fontSize:18, color:'var(--accent)', fontFamily:'var(--font-mono)'}}>{c.issue_count}</div>
            </div>
          )) : <div style={{color:'var(--text-muted)', padding:16, fontSize:13}}>No clusters yet</div>}
        </div>

        <div className="overview-section">
          <h3>{Icons.clock} Recent Scans</h3>
          {(scanHistory || []).length > 0 ? (scanHistory || []).slice(0, 5).map((h, i) => (
            <div key={i} className="scan-history-item">
              <Badge type="source" value={h.source} />
              <span style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text-muted)'}}>{new Date(h.ran_at).toLocaleString()}</span>
              <span style={{marginLeft:'auto', display:'flex', gap:10}}>
                <span>{h.issues_found} found</span>
                <span style={{color:'var(--success)'}}>{h.new_issues} new</span>
              </span>
            </div>
          )) : <div style={{color:'var(--text-muted)', padding:16, fontSize:13}}>No scans yet</div>}
        </div>

        <div className="overview-section">
          <h3>{Icons.shield} Status Summary</h3>
          {stats ? (
            <div>
              {['open','in_progress','ai_fixed','verified','merged','closed','rejected'].map(s => {
                const count = stats[s] || 0;
                const total = stats.total || 1;
                const pct = (count / total) * 100;
                return (
                  <div key={s} className="metric-bar-row">
                    <span className="metric-bar-label">{s.replace(/_/g,' ')}</span>
                    <div className="metric-bar-track">
                      <div className="metric-bar-fill" style={{
                        width: `${pct}%`,
                        background: s === 'open' ? 'var(--low)' : s === 'rejected' ? 'var(--critical)' : s === 'merged' || s === 'verified' ? 'var(--success)' : s === 'ai_fixed' ? 'var(--accent)' : 'var(--text-muted)'
                      }} />
                    </div>
                    <span className="metric-bar-value">{count}</span>
                  </div>
                );
              })}
            </div>
          ) : <div className="loading"><div className="spinner" /></div>}
        </div>
      </div>
    </div>
  );
}

// ─── Sidebar ───────────────────────────────────────────────
function Sidebar({ currentRoute, stats, scanHistory, pluginTabs, theme, onToggleTheme, isOpen }) {
  const getLastScan = (source) => {
    const entry = (scanHistory || []).find(h => h.source === source);
    if (!entry) return { status: 'none', text: 'never' };
    const ago = Math.round((Date.now() - new Date(entry.ran_at).getTime()) / 60000);
    if (ago < 60) return { status: 'ok', text: `${ago}m ago` };
    if (ago < 1440) return { status: 'ok', text: `${Math.round(ago/60)}h ago` };
    return { status: 'stale', text: `${Math.round(ago/1440)}d ago` };
  };

  const navItems = [
    { id: '#/', icon: Icons.home, label: 'Overview' },
    { id: '#/issues', icon: Icons.list, label: 'Issues', badge: stats?.open },
    { id: '#/clusters', icon: Icons.layers, label: 'Clusters' },
    { id: '#/metrics', icon: Icons.chart, label: 'Metrics' },
    { id: '#/settings', icon: Icons.settings, label: 'Settings' },
  ];

  const isActive = (id) => {
    if (id === '#/') return currentRoute === '#/' || currentRoute === '#' || currentRoute === '';
    return currentRoute.startsWith(id);
  };

  return (
    <nav className={`sidebar ${isOpen ? 'open' : ''}`}>
      <div className="sidebar-header">
        <div className="sidebar-logo">
          <div className="logo-icon">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span>autofix</span>-hub
        </div>
        <div className="sidebar-version">v1.0.0</div>
      </div>

      <div className="sidebar-nav">
        <div className="nav-section-label">Navigation</div>
        {navItems.map(item => (
          <button
            key={item.id}
            className={`nav-item ${isActive(item.id) ? 'active' : ''}`}
            onClick={() => navigate(item.id)}
          >
            {item.icon}
            {item.label}
            {item.badge > 0 && <span className="nav-badge">{item.badge}</span>}
          </button>
        ))}

        {pluginTabs.length > 0 && (
          <>
            <div className="nav-section-label" style={{marginTop:8}}>Sources</div>
            {pluginTabs.map(name => (
              <button
                key={name}
                className={`nav-item ${currentRoute === `#/issues/${name}` ? 'active' : ''}`}
                onClick={() => navigate(`#/issues/${name}`)}
              >
                {Icons.folder}
                {name.charAt(0).toUpperCase() + name.slice(1)}
              </button>
            ))}
          </>
        )}
      </div>

      <div className="sidebar-footer">
        {pluginTabs.length > 0 && (
          <div style={{marginBottom:8}}>
            <div className="nav-section-label" style={{padding:'0 0 6px'}}>Last Scans</div>
            {pluginTabs.map(name => {
              const ls = getLastScan(name);
              return (
                <div key={name} className="scanner-status-row">
                  <span className={`status-dot ${ls.status}`} />
                  <span>{name}</span>
                  <span style={{marginLeft:'auto'}}>{ls.text}</span>
                </div>
              );
            })}
          </div>
        )}
        <button className="theme-toggle-btn" onClick={onToggleTheme}>
          {theme === 'dark' ? Icons.sun : Icons.moon}
          {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
        </button>
      </div>
    </nav>
  );
}

// ─── App ───────────────────────────────────────────────────
function App() {
  const route = useHashRoute();
  const [theme, setTheme] = useState(localStorage.getItem('afh-theme') || 'dark');
  const [stats, setStats] = useState(null);
  const [scanners, setScanners] = useState([]);
  const [scanHistory, setScanHistory] = useState([]);
  const [clusters, setClusters] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const toastId = useRef(0);

  const addToast = (message, type = 'info') => {
    const id = ++toastId.current;
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };

  const toggleTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    localStorage.setItem('afh-theme', next);
  };

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const refreshData = useCallback(() => {
    api('/stats').then(setStats).catch(() => {});
    api('/scanners').then(d => setScanners(d.scanners || [])).catch(() => {});
    api('/scan-history?limit=10').then(d => setScanHistory(d.history || [])).catch(() => {});
    api('/clusters').then(d => setClusters(d.clusters || [])).catch(() => {});
  }, []);

  useEffect(() => {
    refreshData();
    const iv = setInterval(refreshData, 30000);
    return () => clearInterval(iv);
  }, [refreshData]);

  // Close sidebar on nav (mobile)
  useEffect(() => { setSidebarOpen(false); }, [route]);

  const pluginTabs = scanners.filter(s => s.installed).map(s => s.name);

  // Route matching
  let page;
  let sourceFilter = '';

  if (route.startsWith('#/issue/')) {
    const issueId = decodeURIComponent(route.replace('#/issue/', ''));
    page = <IssueDetailPage issueId={issueId} addToast={addToast} />;
  } else if (route.startsWith('#/clusters/')) {
    const clusterId = route.replace('#/clusters/', '');
    page = <ClusterDetailPage clusterId={clusterId} addToast={addToast} />;
  } else if (route === '#/clusters') {
    page = <ClustersPage addToast={addToast} />;
  } else if (route === '#/metrics') {
    page = <MetricsPage addToast={addToast} />;
  } else if (route === '#/settings') {
    page = <SettingsPage addToast={addToast} />;
  } else if (route.startsWith('#/issues/')) {
    sourceFilter = route.replace('#/issues/', '');
    page = <IssuesPage sourceFilter={sourceFilter} addToast={addToast} />;
  } else if (route === '#/issues') {
    page = <IssuesPage sourceFilter="" addToast={addToast} />;
  } else {
    page = <OverviewPage stats={stats} clusters={clusters} scanHistory={scanHistory} addToast={addToast} onRefresh={refreshData} />;
  }

  return (
    <div className="app-layout">
      <ToastContainer toasts={toasts} />

      {/* Mobile header */}
      <div className="mobile-header">
        <button className="mobile-menu-btn" onClick={() => setSidebarOpen(o => !o)}>{Icons.menu}</button>
        <span style={{fontWeight:700, fontSize:16}}><span style={{color:'var(--accent)'}}>autofix</span>-hub</span>
      </div>

      {/* Sidebar overlay (mobile) */}
      <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)} />

      <Sidebar
        currentRoute={route}
        stats={stats}
        scanHistory={scanHistory}
        pluginTabs={pluginTabs}
        theme={theme}
        onToggleTheme={toggleTheme}
        isOpen={sidebarOpen}
      />

      <main className="main-content">
        {page}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
